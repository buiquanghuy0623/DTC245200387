services:
  app:
    build: .
    container_name: gym-app
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-gymdb}
      DB_USER: ${MYSQL_USER:-gymuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change_me_gym}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_FILE: /app/logs/app.log
      GYM_ADMIN_USERNAME: ${GYM_ADMIN_USERNAME:?Set GYM_ADMIN_USERNAME in .env}
      GYM_ADMIN_PASSWORD: ${GYM_ADMIN_PASSWORD:?Set GYM_ADMIN_PASSWORD in .env}
      GYM_SESSION_SECRET: ${GYM_SESSION_SECRET:?Set GYM_SESSION_SECRET in .env}
      ENABLE_TEST_ERROR_ENDPOINT: ${ENABLE_TEST_ERROR_ENDPOINT:-false}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    ports:
      - "3000:3000"
      - "8081:3000"
    networks: [gymnet]

  mysql:
    platform: linux/amd64
    image: mariadb:10.11
    container_name: gym-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gymdb}
      MYSQL_USER: ${MYSQL_USER:-gymuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_gym}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [gymnet]

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: gym-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [gymnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: gym-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx-files
    depends_on:
      - app
      - phpmyadmin
    networks: [gymnet]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: gym-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks: [gymnet]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: gym-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM_ADDRESS:-}
      GRAFANA_ALERT_EMAIL: ${GRAFANA_ALERT_EMAIL:-${GRAFANA_SMTP_USER:-}}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks: [gymnet]

  loki:
    image: grafana/loki:3.4.2
    container_name: gym-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks: [gymnet]

  promtail:
    image: grafana/promtail:3.4.2
    container_name: gym-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - app_logs:/var/log/app:ro
      - nginx_logs:/var/log/nginx:ro
    depends_on:
      - loki
      - app
    networks: [gymnet]

volumes:
  mysql_data:
  grafana_data:
  loki_data:
  app_logs:
  nginx_logs:

networks:
  gymnet:
    driver: bridge