server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: gym-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: gym-app
          app: gym-fitness
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            method: method
            path: path
            status: status
            duration_ms: duration_ms
      - labels:
          level:
          method:
          status:
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          app: gym-fitness
          __path__: /var/log/nginx/*.log
