apiVersion: 1

groups:
  - orgId: 1
    name: GymFit alerts
    folder: GymFit
    interval: 1m
    rules:
      - uid: gymfit-http-5xx
        title: HTTP 5xx errors
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum(increase(http_requests_total{status=~"5.."}[5m])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: HTTP 5xx responses detected
          description: At least one HTTP 5xx response occurred in the last five minutes.
        labels:
          severity: warning
        isPaused: false
