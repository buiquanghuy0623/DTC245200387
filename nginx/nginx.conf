worker_processes auto;
error_log /var/log/nginx-files/error.log warn;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  access_log /var/log/nginx-files/access.log;

  upstream gym_app { server app:3000; }
  upstream gym_phpmyadmin { server phpmyadmin:80; }

  server {
    listen 80;
    server_name _;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location = /phpmyadmin {
      return 301 /phpmyadmin/;
    }

    location /phpmyadmin/ {
      proxy_pass http://gym_phpmyadmin/;
      proxy_redirect ~^(/.*)$ /phpmyadmin$1;
    }

    location / {
      proxy_pass http://gym_app;
    }
  }
}
